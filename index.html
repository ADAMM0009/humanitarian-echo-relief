<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كلوب المعاونة الإنسانية</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        header { background: #f4f4f4; padding: 10px 20px; text-align: center; }
        section { margin: 20px 0; }
        .gallery img { width: 300px; height: 200px; margin: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <header>
        <h1>مرحباً بكم في موقع كلوب المعاونة الإنسانية</h1>
    </header>
    
    <section>
        <h2>عن الكلوب</h2>
        <p>هذا الموقع مخصص لنشر الخير ومساعدة المحتاجين.</p>
    </section>

    <section>
        <h2>فريقنا</h2>
        <p>تعرف على أعضاء الكلوب الذين يعملون بجد لمساعدة الآخرين.</p>
        <ul>
            <li>العضو الأول</li>
            <li>العضو الثاني</li>
        </ul>
    </section>

    <section>
        <h2>صور من أعمالنا</h2>
        <div class="gallery">
            <img src="placeholder1.jpg" alt="مساعدة المحتاجين">
            <img src="placeholder2.jpg" alt="أنشطة تطوعية">
        </div>
    </section>
</body>
</html>
